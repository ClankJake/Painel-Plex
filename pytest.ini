[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra mostra um resumo de tudo o que não passou no fim da execução.
addopts = -ra --strict-markers

markers =
    integration: testes que criam a aplicação Flask e usam a base de dados.

filterwarnings =
    # Os esquemas da API ainda usam o estilo @validator do Pydantic v1, suportado
    # (com aviso) pelo Pydantic v2. O aviso é conhecido e não deve poluir a saída.
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:app.blueprints.api.schemas
    # A aplicação ainda usa o estilo antigo `Model.query.get()` do SQLAlchemy.
    # É um aviso conhecido e repetido em quase todas as consultas — silenciado
    # aqui para que a saída dos testes continue legível.
    ignore::sqlalchemy.exc.LegacyAPIWarning
