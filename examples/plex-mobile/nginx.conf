# Exemplo para Debian/Ubuntu. Inclua no contexto http (conf.d ou sites-enabled).
server {
    listen 443 ssl;
    server_name sala.example.com;
    ssl_certificate /etc/letsencrypt/live/sala.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sala.example.com/privkey.pem;

    root /var/www/plex-mobile;
    index index.html;
    access_log off;

    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; media-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/account/(pins(/[0-9]+)?|resources)$ {
        limit_except GET POST { deny all; }
        rewrite ^/account/(.*)$ /api/v2/$1 break;
        proxy_pass https://plex.tv;
        proxy_set_header Host plex.tv;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
    }

    location ~ ^/media/(identity|library/(sections(/[0-9]+/all)?|metadata/[0-9]+(/children|/thumb(/[0-9]+)?)?|parts/[0-9]+(/[0-9]+)?/[A-Za-z0-9_.-]+))$ {
        limit_except GET { deny all; }
        rewrite ^/media(/.*)$ $1 break;
        # Endereço privado do Plex Media Server a partir do Nginx.
        proxy_pass http://127.0.0.1:32400;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_buffering off;
        # Capas e vídeos carregados pelo navegador podem ter token na URL.
        error_log /dev/null crit;
    }
}
